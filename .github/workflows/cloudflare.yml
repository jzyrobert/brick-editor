name: Validate and publish Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm test
      - run: npm run library:validate
      - name: Browser acceptance tests
        run: npm run test:browser

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # Cloudflare's installed GitHub integration watches only this branch.
      # Advancing it after acceptance keeps credentials out of this repository.
      - name: Publish tested commit to Cloudflare
        run: git push origin HEAD:refs/heads/cloudflare-production
