name: Validate and deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm test
      - run: npm run library:validate
      - name: Browser acceptance tests
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-static-site
          path: dist
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # Keep a tested source branch for manual builds as well as direct uploads.
      - name: Advance tested deployment source
        run: git push origin HEAD:refs/heads/cloudflare-production
      - name: Report missing deployment credential
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not configured. Tests passed, but automatic Cloudflare publication is skipped."
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: cloudflare-static-site
          path: dist
      - name: Deploy tested assets to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.142.0"
          command: pages deploy dist --project-name=brick-editor --branch=cloudflare-production --commit-hash=${{ github.sha }} --commit-message=${{ github.sha }}
