name: Validate and deploy Cloudflare Pages

on:
  push:
    branches: [main]
  # Pull requests into main run the same build, checks and browser shards;
  # like manual runs they validate only (publish is main-only, below), and a
  # new push to the PR cancels its superseded run.
  pull_request:
    branches: [main]
  # Manual runs on any branch validate only; publish is main-only (below).
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "0"

# One run per ref at a time. Superseded branch runs are cancelled; main runs
# queue so every main commit is validated. Publication itself is serialised
# separately on the publish job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build the production bundle once; every browser shard tests this artifact
  # and publish deploys the same one.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run build
      # dist includes the committed complete LDraw pack (~3,100 content-addressed
      # chunks); keep the deployment within Cloudflare Pages file limits.
      - name: Check Cloudflare Pages limits
        run: npm run deploy:check
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-static-site
          path: dist
          retention-days: 7

  # Static checks need no browser installation or physics-test worker.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx prettier --check .github/workflows
      - run: npm run library:validate

  # Bound CPU contention and distribute the native/geometry suites across VMs.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: unit (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm test -- --project=unit --shard=${{ matrix.shard }}/3 --maxWorkers=2 --reporter=default --reporter=json --outputFile=.local/unit-results.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-results-${{ matrix.shard }}
          path: .local/unit-results.json
          retention-days: 7

  # Wall-clock assertions retain their budgets on an otherwise idle runner.
  unit_performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm test -- --project=performance --maxWorkers=1 --reporter=default --reporter=json --outputFile=.local/unit-performance.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-performance-results
          path: .local/unit-performance.json
          retention-days: 7

  # Only headless CLI integration tests need Chromium. Do not run competing
  # browsers alongside the native unit tests or performance budgets.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      # The headless CLI integration tests drive Chromium too.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install browser test runtime
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test -- --project=integration --maxWorkers=1 --reporter=default --reporter=json --outputFile=.local/integration-results.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: integration-results
          path: .local/integration-results.json
          retention-days: 7

  # Browser acceptance tests on software WebGL, split across parallel jobs:
  # the main project in eight shards, the path-traced Photo tests (@heavy) in
  # two, and the wall-clock budget tests (@perf) alone, one at a time, so no
  # other test competes for the CPU they are timing. Each shard uses one
  # worker; main files are balanced by measured duration rather than count.
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: main-1, project: main, shard: 1/8 }
          - { id: main-2, project: main, shard: 2/8 }
          - { id: main-3, project: main, shard: 3/8 }
          - { id: main-4, project: main, shard: 4/8 }
          - { id: main-5, project: main, shard: 5/8 }
          - { id: main-6, project: main, shard: 6/8 }
          - { id: main-7, project: main, shard: 7/8 }
          - { id: main-8, project: main, shard: 8/8 }
          - { id: heavy-1, project: heavy, shard: 1/2 }
          - { id: heavy-2, project: heavy, shard: 2/2 }
          - { id: perf, project: perf, shard: 1/1 }
    name: browser (${{ matrix.id }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install browser test runtime
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-static-site
          path: dist
      - name: Browser acceptance tests (${{ matrix.id }})
        run: npx tsx scripts/ci-browser.ts ${{ matrix.project }} ${{ matrix.shard }}
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.id }}.zip
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.id }}
          path: blob-report
          retention-days: 7

  # One HTML (and JSON) report for all shards, including traces of failures.
  report:
    needs: browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge browser test reports
        run: npx playwright merge-reports --reporter html,json all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/results.json
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  # Single required gate: everything above passed.
  verified:
    needs: [build, checks, unit, unit_performance, integration, browser, report]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All validation jobs passed
        run: |
          echo "build=${{ needs.build.result }} checks=${{ needs.checks.result }} unit=${{ needs.unit.result }} unit_performance=${{ needs.unit_performance.result }} integration=${{ needs.integration.result }} browser=${{ needs.browser.result }} report=${{ needs.report.result }}"
          test "${{ needs.build.result }}" = success
          test "${{ needs.checks.result }}" = success
          test "${{ needs.unit.result }}" = success
          test "${{ needs.unit_performance.result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.browser.result }}" = success
          test "${{ needs.report.result }}" = success

  publish:
    needs: verified
    # Only main is ever published, whatever triggered the run.
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # Keep a tested source branch for manual builds as well as direct uploads.
      - name: Advance tested deployment source
        run: git push origin HEAD:refs/heads/cloudflare-production
      - name: Report missing deployment credential
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not configured. Tests passed, but automatic Cloudflare publication is skipped."
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: cloudflare-static-site
          path: dist
      - name: Deploy tested assets to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.142.0"
          command: pages deploy dist --project-name=brick-editor --branch=cloudflare-production --commit-hash=${{ github.sha }} --commit-message=${{ github.sha }}
