# The gallery's D1 database and R2 bucket, for `npm run gallery:publish`
# (docs/GALLERY-PLAN.md). Kept out of wrangler.toml while no Pages Function
# uses them (Pages reads wrangler.toml on deploy). Both databases were created
# on 3 October 2026 with migrations/0001_gallery.sql applied; the R2 bucket
# waits on R2 being enabled for the account.
name = "brick-gallery"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "brick-gallery"
database_id = "5bb746af-e58e-478c-ad36-5009d4c594d3"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "brick-gallery"

# For Pages preview deployments (phase 2).
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "brick-gallery-preview"
database_id = "782a7002-6cb9-42b6-bd70-3777e078d327"
migrations_dir = "migrations"
